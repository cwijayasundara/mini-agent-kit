[project]
name = "mini-agent-kit"
version = "0.1.0"
description = "An offline toolkit for tool-using agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mini-agent = "mini_agent_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent_kit"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
