name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches drift and runs the maintain loop
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check --isolated src tests
      - run: uv run ruff check --isolated --extend-select C901,PLR0912,PLR0913,PLR0915 --config 'lint.mccabe.max-complexity=10' src
      - run: uv run ruff format --isolated --check src tests
      - run: uv run mypy --strict --config-file .factory/gates/mypy.ini src
      - run: uv run mini-agent demo
      - name: trace sensor on a demo trace
        run: |
          uv run mini-agent run --script src/mini_agent_kit/scripts/demo.json --trace demo-trace.json "demo"
          uv run python tools/trace_sensor.py demo-trace.json
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact
      - name: semgrep
        run: uvx semgrep scan --config p/python --config p/secrets --quiet --metrics=off --error src tools tests
  drift:
    # Weekly: regenerate traces from the offline evals, run the drift detector, keep the traces.
    # Exit 1 (tier "log") is expected because some evals exercise failures on purpose; tier 2+ fails the job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python tools/eval_traces.py evals traces-ci
      - run: uv run python tools/drift.py traces-ci || [ $? -lt 2 ]
      - uses: actions/upload-artifact@v4
        with:
          name: traces
          path: traces-ci/
